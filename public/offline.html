<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#5B5FEF">
<title>Offline — Room Ledger</title>
<style>
  :root{color-scheme:light dark;--bg:#fff;--fg:#14142b;--muted:#6b6b80}
  @media (prefers-color-scheme:dark){:root{--bg:#0f0f1a;--fg:#f2f2fa;--muted:#9a9ab0}}
  html,body{height:100%;margin:0}
  body{display:grid;place-items:center;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;padding:24px;text-align:center}
  img{width:72px;height:72px;border-radius:16px}
  h1{font-size:1.25rem;margin:16px 0 8px}
  p{margin:0 0 20px;color:var(--muted);font-size:.95rem;max-width:28ch}
  button{background:#5B5FEF;color:#fff;border:0;border-radius:10px;padding:10px 18px;font-size:.95rem;font-weight:600}
</style>
</head>
<body>
  <main>
    <img src="/icons/icon-192.png" alt="">
    <h1>You're offline</h1>
    <p>Room Ledger needs a connection to sync your household's expenses.</p>
    <button onclick="location.reload()">Try again</button>
  </main>
</body>
</html>
